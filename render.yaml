# Blueprint Render : service web + base PostgreSQL, offre gratuite pour les tests.
databases:
  - name: youdrink-db
    plan: free
    region: frankfurt
    databaseName: youdrink
    user: youdrink

services:
  - type: web
    name: youdrink
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: youdrink-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alamb'hic</title>
<meta name="description" content="Jeu de soirée entre amis : taux estimés, courbes communes, titres et alertes.">
<meta name="theme-color" content="#0a1626">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<style>html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
<header><img src="/logo.png" alt="Alamb'hic"><div class="row" style="gap:8px"><span class="chip" id="codeChip" hidden></span><button class="chip" id="docsBtn" hidden>Docs</button><button class="chip" id="demoHdr">Démo</button><button class="chip" id="profBtn" hidden>Profil</button></div></header>
<main id="app"></main>
</div>
<nav id="nav" hidden><div class="in">
<button data-tab="moi">Moi</button><button data-tab="courbes">Courbes</button><button data-tab="classement">Classement</button><button data-tab="fil">Fil<span class="n" id="feedN" hidden></span></button>
</div></nav>
<div class="demo" id="demoBar" hidden><div class="in">
<div class="top"><span class="label" style="color:var(--accent)">Démo · soirée fictive</span><span class="clock" id="demoClock">19:00</span><div class="row" style="gap:6px"><button class="btn small" id="demoPlay">Lecture</button><button class="btn ghost small" id="demoQuit">Quitter</button></div></div>
<input type="range" id="demoRange" min="0" max="660" step="5" value="0" aria-label="Heure de la soirée">
<div class="scale"><span>19h</span><span>21h</span><span>23h</span><span>1h</span><span>3h</span><span>5h</span></div>
</div></div>
<div id="toasts" aria-live="polite"></div>
<script src="/engine.js"></script>
<script src="/avatar.js"></script>
<script src="/app.js"></script>
</body>
</html>

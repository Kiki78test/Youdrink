<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'B';font-weight:800;src:url(../docs-src/fonts/bricolage-grotesque-latin-800-normal.woff2)}
@font-face{font-family:'B';font-weight:600;src:url(../docs-src/fonts/bricolage-grotesque-latin-600-normal.woff2)}
body{margin:0;background:#1d1915;font-family:'B',sans-serif;color:#f7f1ea;width:1400px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px}
.c{border-radius:22px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.c .t{position:absolute;left:22px;top:16px;font:600 18px 'B';letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.dark{background:#0c0a08}.cream{background:#fbf3e6;color:#1a1006}.orange{background:#f7941d;color:#1a1006}
.wm{display:flex;align-items:center;gap:12px;font-weight:800;font-size:84px;letter-spacing:-2px;line-height:1}
.pill{background:#f7941d;color:#1a1006;border-radius:20px;padding:2px 16px 12px}
.pill.dk{background:#1a1006;color:#f7941d}
.tilt{display:inline-block;transform:rotate(-7deg)}
.wob span{display:inline-block}
.tag{font:600 22px 'B';opacity:.75;margin-top:18px;letter-spacing:.02em}
.badge{width:250px;height:250px;border-radius:50%;background:#0c0a08;border:6px solid #f7941d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.badge b{font-size:40px;letter-spacing:-1px;color:#f7f1ea}.badge b i{font-style:normal;color:#f7941d}
.spark{position:absolute;color:#f7941d;font-size:28px}
</style></head><body><div class="grid">
<div class="c dark"><span class="t">A · Classique</span>
 <div class="wm"><img src="icon.svg" style="height:120px"><span>Alamb'</span><span class="pill">hic</span></div>
 <div class="tag">On trinque, on se chambre, on se surveille.</div></div>
<div class="c dark"><span class="t">B · Pompette</span>
 <div class="wm wob"><span style="transform:rotate(-4deg)">Alamb</span><img src="icon.svg" style="height:96px;transform:rotate(14deg);margin:0 -4px"><span class="pill tilt" style="transform:rotate(8deg) translateY(10px)">hic!</span></div>
 <span class="spark" style="left:250px;top:70px">✦</span><span class="spark" style="right:230px;top:60px;font-size:20px">✦</span>
 <div class="tag">La version qui penche, comme l'avatar.</div></div>
<div class="c cream"><span class="t">C · Fond clair</span>
 <div class="wm"><img src="icon-dark.svg" style="height:120px"><span>Alamb'</span><span class="pill">hic</span></div>
 <div class="tag">Pour les documents, la boutique, les réseaux.</div></div>
<div class="c orange"><span class="t">D · Badge / icône</span>
 <div style="display:flex;gap:40px;align-items:center">
  <div class="badge"><img src="icon.svg" style="height:120px"><b>Alamb'<i>hic</i></b></div>
  <div style="width:180px;height:180px;border-radius:40px;background:#0c0a08;display:flex;align-items:center;justify-content:center"><img src="icon.svg" style="height:140px"></div>
 </div></div>
</div></body></html>
